<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rumble Roads">
    <meta name="theme-color" content="#000000">
    <title>Rumble Roads</title>
    <link rel="icon" type="image/png" sizes="192x192" href="TemplateData/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="TemplateData/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script>window.rumbleVersion = "0.1.0";</script>
    <script src="TemplateData/diagnostics.js"></script>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading">
      <div id="unity-title">Rumble Roads</div>
      <div id="unity-progress"><div id="unity-progress-fill"></div></div>
    </div>
    <div id="unity-warning"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var progressFill = document.querySelector("#unity-progress-fill");
      var warning = document.querySelector("#unity-warning");

      function showBanner(message, type) {
        var line = document.createElement("div");
        line.textContent = message;
        line.className = type == "error" ? "unity-error" : "unity-note";
        warning.appendChild(line);
        if (type != "error") {
          setTimeout(function () { warning.removeChild(line); }, 5000);
        }
      }

      var rumbleStorage = window.rumbleStorage = {
        canStore: true,
        persisted: false,
        installed: window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
      };

      try {
        var probe = window.indexedDB.open("rumble-roads-storage-check");
        probe.onerror = function () { rumbleStorage.canStore = false; };
        probe.onsuccess = function () { probe.result.close(); };
      } catch (error) {
        rumbleStorage.canStore = false;
      }

      if (navigator.storage && navigator.storage.persisted) {
        navigator.storage.persisted().then(function (kept) {
          rumbleStorage.persisted = kept;
          if (!kept && navigator.storage.persist) {
            return navigator.storage.persist().then(function (granted) { rumbleStorage.persisted = granted; });
          }
        }).catch(function () {});
      }

      var maxPixelRatio = 2;

      function typing() {
        var focused = document.activeElement;
        return !!focused && (focused.tagName == "INPUT" || focused.tagName == "TEXTAREA");
      }

      function fitCanvas() {
        if (window.navigator.standalone !== true || typing()) {
          return;
        }

        var root = document.documentElement;
        canvas.style.width = Math.max(window.innerWidth, root.clientWidth) + "px";
        canvas.style.height = Math.max(window.innerHeight, root.clientHeight) + "px";
      }

      fitCanvas();
      window.addEventListener("resize", fitCanvas);
      window.addEventListener("orientationchange", function () { setTimeout(fitCanvas, 300); });
      document.addEventListener("focusout", function () { setTimeout(fitCanvas, 300); });
      if (screen.orientation && screen.orientation.addEventListener) {
        screen.orientation.addEventListener("change", fitCanvas);
      }

      function quietKeyboardBar(node) {
        if (node.nodeType != 1 || node.tagName != "DIV" || node.id || !node.querySelector) {
          return;
        }

        var input = node.querySelector("input, textarea");
        var button = node.querySelector("button");
        if (input && button && button.textContent == "OK") {
          node.className = "unity-keyboard-bar";
        }
      }

      new MutationObserver(function (changes) {
        changes.forEach(function (change) { change.addedNodes.forEach(quietKeyboardBar); });
      }).observe(document.body, { childList: true });

      function ignoreForeignError(message, filename) {
        return !filename && String(message).indexOf("Script error") == 0;
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/85ff2b354d85029f4a8c530d833c16f8.data.unityweb",
        frameworkUrl: buildUrl + "/855aa0b6586ba44d0d09014c0597b6d4.framework.js.unityweb",
        codeUrl: buildUrl + "/28af5bcba7f3e0ec0e84f777eb386dd5.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "The Dragon's Lair Gaming Studio",
        productName: "Rumble Roads",
        productVersion: "0.1.0",
        autoSyncPersistentDataPath: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, maxPixelRatio),
        showBanner: showBanner,
        errorHandler: ignoreForeignError
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/3b925a2fed3e2b111572d2e93d783501.loader.js";
      var downloaded = false;
      script.onload = function () {
        rumbleDiagnostics.mark("loader");
        createUnityInstance(canvas, config, function (progress) {
          progressFill.style.width = 100 * progress + "%";
          if (!downloaded && progress >= 0.9) {
            downloaded = true;
            rumbleDiagnostics.mark("downloaded");
          }
        }).then(function () {
          rumbleDiagnostics.mark("ready");
          loading.style.display = "none";
        }).catch(function (message) {
          showBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
