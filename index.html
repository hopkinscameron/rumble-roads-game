    <script>
      (function () {

        var LB = mb.getTotalLength(), LL = ml.getTotalLength();

          bar.setAttribute("aria-valuenow", pc);

          btn.hidden = false; btn.focus();
          btn.onclick = function () { hide(); if (onPlay) onPlay(); };
        }
        function fail(onRetry) {
          failed = true;
          statusEl.textContent = "Couldn’t load the game";
          subEl.textContent = "Check your connection and try again.";
          head.setAttribute("opacity", 0);
          btn.textContent = "Try again"; btn.hidden = false; btn.focus();
          btn.onclick = function () { if (onRetry) onRetry(); else location.reload(); };
        }
